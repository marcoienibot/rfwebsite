# Checks pull requests before they reach main, where every push is deployed
# straight to GitHub Pages (see deploy.yml).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request makes the previous run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Check that seed/seed.json matches scripts/schema.mjs
        run: |
          node scripts/schema.mjs
          git diff --exit-code -- seed/seed.json || {
            echo "::error file=seed/seed.json::seed/seed.json is out of date. Run 'node scripts/schema.mjs' and commit the result."
            exit 1
          }

      - name: Validate the WordPress migration page definitions
        run: node scripts/wordpress/check-pages.mjs

      - name: Typecheck
        run: npm run typecheck

      # Build under a sub-path, like the GitHub Pages deployment, so that the
      # root-relative link rewriting in integrations/static-site.mjs runs too.
      - name: Build website
        run: npm run build
        env:
          SITE_URL: https://marcoienibot.github.io/rfwebsite

      # The site needs no cookie banner because its pages don't embed other
      # sites. An iframe (a YouTube player, a map, a form) loads another site
      # along with the page, and that site can set cookies and track visitors.
      # An HTML block shown in an isolated frame is an iframe too, and its
      # scripts can load other sites, so it fails the check as well.
      - name: Check that no page embeds an iframe
        run: |
          status=0
          grep -rl --include='*.html' '<iframe' dist/client || status=$?
          if [ "$status" -eq 0 ]; then
            echo "::error::The pages above contain an iframe, which can load another site (and its cookies and tracking) with the page, so the site would need a cookie banner. Embed videos with src/components/VideoEmbed.astro, which loads the player only on click. An iframe with class emdash-html-block is an HTML block shown in an isolated frame: in the admin, switch it to Inline, or remove it."
            exit 1
          fi
          # grep exits 1 when no page matches. Any other status is an error,
          # such as a missing dist/client, and must fail the step.
          [ "$status" -eq 1 ] || exit "$status"

  presentation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: presentation
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: presentation/package-lock.json

      - run: npm ci

      - run: npx slidev build --base /rfwebsite/presentation/
