# Builds the static website (and the presentation) from main and publishes
# them to GitHub Pages, which serves the gh-pages branch. Runs on every push,
# including the ones made by the "Publish website" button in the EmDash admin.
# Pull request previews live in the same branch, under pr-preview/ (see
# pr-preview.yml).
name: Deploy website

on:
  push:
    branches: [main]
  # Rebuild every night so scheduled posts go live and past events move to
  # the "past" list without anyone having to publish.
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a deployment halfway; queue the next one instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Only main is the live site, even when the workflow is started by hand.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push to the gh-pages branch
      pages: read # look up the site URL
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # html_url follows the custom domain, if one is configured.
      - name: Get the GitHub Pages URL
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .html_url)
          echo "url=${url%/}" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/build-site
        with:
          site-url: ${{ steps.pages.outputs.url }}

      # Serve the files as they are: Jekyll would leave out `_astro/`.
      - run: touch dist/client/.nojekyll

      - uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          folder: dist/client
          branch: gh-pages
          # Keep the pull request previews,
          clean-exclude: pr-preview/
          # and rebase onto a preview pushed at the same time instead of overwriting it.
          force: false
