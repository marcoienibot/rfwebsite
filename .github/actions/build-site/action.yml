# Builds the website and the presentation into dist/client, to be served from
# `site-url`. Shared by deploy.yml and pr-preview.yml, so that pull request
# previews are built exactly like the live site.
name: Build site
description: Build the website and the presentation into dist/client.

inputs:
  site-url:
    description: URL the site will be served from, without a trailing slash.
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: |
          package-lock.json
          presentation/package-lock.json

    - name: Build website
      shell: bash
      env:
        SITE_URL: ${{ inputs.site-url }}
      run: |
        npm ci
        npm run build

    - name: Build presentation
      shell: bash
      working-directory: presentation
      env:
        SITE_URL: ${{ inputs.site-url }}
      run: |
        npm ci
        base_path=$(node -p 'new URL(process.argv[1]).pathname.replace(/\/$/, "")' "$SITE_URL")
        npx slidev build --base "$base_path/presentation/" --out ../dist/client/presentation
